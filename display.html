<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Queue — SOMA Sanctuary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;500;600&family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="/brand/lockup-square.png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="board">
  <div class="spine" aria-hidden="true"></div>
  <header class="masthead">
    <img class="mark" src="/brand/lockup-square.png" alt="" />
    <div>
      <img class="wordmark" src="/brand/wordmark.png" alt="SOMA Sanctuary" />
      <p class="tagline">Release · Restore · Return</p>
      <a class="site" href="https://www.somasanctuary.nyc" target="_blank" rel="noreferrer">www.somasanctuary.nyc</a>
    </div>
  </header>
  <p class="product">SOMA Sanctuary · JTQ</p>
  <h1>Join The Queue</h1>
  <p class="lede" id="status">Live board · first names only</p>
  <div id="list"></div>
  <script>
    async function refresh() {
      const res = await fetch("/api/display");
      const data = await res.json();
      const status = document.getElementById("status");
      const list = document.getElementById("list");
      if (!data.enabled) {
        status.textContent = "Public display is off.";
        list.innerHTML = "";
        return;
      }
      if (!data.clients.length) {
        status.textContent = "No one is waiting right now.";
        list.innerHTML = "";
        return;
      }
      status.textContent = "Please return around the time shown · updates every 30 seconds";
      list.replaceChildren();
      data.clients.forEach((c) => {
        const row = document.createElement("div");
        row.className = "board-row";
        const name = document.createElement("span");
        const time = document.createElement("span");
        name.textContent = c.first_name;
        time.textContent = c.return_label;
        row.append(name, time);
        list.append(row);
      });
    }
    refresh();
    setInterval(refresh, 30000);
  </script>
</body>
</html>
